services:
  - type: web
    name: spamshield-ai
    env: python
    buildCommand: "pip install -r requirements.txt && python app/train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
